<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dot">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Dot</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 6vw, 80px);
    cursor: pointer;
    user-select: none;
    font-family: 'Courier New', monospace;
  }

  @media (max-width: 500px) {
    .eye { width: 38vw; height: 34vh; }
    #popup { font-size: 12px; padding: 10px 16px; max-width: 88vw; bottom: 64px; }
    #text-input { width: 200px; font-size: 11px; }
    #toggle-text, #notif-btn { font-size: 9px; padding: 6px 10px; }
    #notif-btn { bottom: 30px; left: 12px; }
    #toggle-text { bottom: 30px; right: 12px; }
  }

  /* ── Eyes ── */
  .eye {
    width: clamp(100px, 30vw, 260px);
    height: clamp(140px, 40vh, 380px);
    background: #00ff7f;
    border-radius: clamp(12px, 2.5vw, 28px);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px #00ff7f, 0 0 120px rgba(0,255,127,.3), 0 0 240px rgba(0,255,127,.1);
    transition: transform .2s ease, box-shadow .35s ease, background .3s ease;
    will-change: transform, box-shadow;
  }
  .eye.blink { transform: scaleY(.04) !important; transition: transform .07s ease !important; }

  body.listening .eye {
    background: #55ffaa;
    box-shadow: 0 0 90px #00ff7f, 0 0 200px rgba(0,255,127,.5), 0 0 380px rgba(0,255,127,.15);
    animation: pulse 1.4s ease-in-out infinite;
  }
  body.speaking .eye {
    box-shadow: 0 0 80px #00ff7f, 0 0 180px rgba(0,255,127,.45), 0 0 320px rgba(0,255,127,.12);
  }
  body.thinking .eye {
    background: #00cc66;
    box-shadow: 0 0 40px #00cc66, 0 0 100px rgba(0,204,102,.25);
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.035); }
  }

  /* ── Pupils ── */
  .pupil {
    width: 26%; height: 30%;
    background: #001508;
    border-radius: 6px;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    transition: transform .12s cubic-bezier(.25,.46,.45,.94), width .25s, height .25s, border-radius .25s;
    will-change: transform;
  }
  body.thinking .pupil { width: 12%; height: 14%; border-radius: 50%; }

  /* ── Sleep ── */
  body.sleeping .eye {
    transform: scaleY(0.03) !important;
    background: #003322 !important;
    box-shadow: 0 0 8px #003322 !important;
    animation: none !important;
    transition: transform 1.5s ease, background 1.2s, box-shadow 1.2s !important;
  }
  body.sleeping .pupil { opacity: 0; transition: opacity .8s; }

  /* ── Labels ── */
  #name {
    position: fixed; top: 22px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: .38em;
    color: #0d200d; pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: #0a1a0a; pointer-events: none;
    transition: color .4s, opacity .3s;
  }
  body.listening #hint { color: #00ff7f; }
  body.thinking  #hint { color: #004422; }
  body.speaking  #hint { color: #004422; }
  #hint.hidden { opacity: 0; }

  /* ── Popup ── */
  #popup {
    position: fixed; bottom: 74px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    font-size: 13px; letter-spacing: .05em; color: #00ff7f;
    background: rgba(0,8,2,.9); border: 1px solid #004020;
    border-radius: 14px; padding: 13px 24px;
    max-width: 66vw; text-align: center; line-height: 1.65;
    opacity: 0; transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
  }
  #popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Reminder (top) ── */
  #reminder {
    position: fixed; top: 54px; left: 50%;
    transform: translateX(-50%) translateY(-8px);
    font-size: 12px; letter-spacing: .06em;
    color: #000; background: #00ff7f;
    border-radius: 10px; padding: 10px 24px;
    max-width: 68vw; text-align: center; line-height: 1.5;
    opacity: 0; transition: opacity .4s ease, transform .4s ease;
    pointer-events: none; box-shadow: 0 0 28px rgba(0,255,127,.55);
  }
  #reminder.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Text input ── */
  #text-bar {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #text-bar.show { opacity: 1; pointer-events: all; }
  #text-input {
    background: #030c03; border: 1px solid #004020; border-radius: 999px;
    color: #00ff7f; font-family: 'Courier New', monospace; font-size: 12px;
    letter-spacing: .07em; padding: 9px 20px; outline: none; width: 270px;
    transition: border-color .2s;
  }
  #text-input:focus { border-color: #00ff7f; }
  #text-input::placeholder { color: #1c3a1c; }
  #text-send {
    background: #00ff7f; border: none; border-radius: 999px;
    color: #000; font-family: 'Courier New', monospace; font-size: 11px;
    letter-spacing: .15em; padding: 9px 18px; cursor: pointer;
    transition: box-shadow .2s, transform .1s;
  }
  #text-send:hover  { box-shadow: 0 0 22px #00ff7f; }
  #text-send:active { transform: scale(.96); }

  /* ── Toggle + Notif buttons ── */
  #toggle-text {
    position: fixed; bottom: 30px; right: 22px;
    background: none; border: 1px solid #1a3a1a; border-radius: 999px;
    color: #1a3a1a; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: .15em; padding: 7px 13px; cursor: pointer;
    transition: color .25s, border-color .25s;
  }
  #toggle-text:hover { color: #00ff7f; border-color: #00ff7f; }

  #notif-btn {
    position: fixed; bottom: 30px; left: 22px;
    background: none; border: 1px solid #1a3a1a; border-radius: 999px;
    color: #1a3a1a; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: .15em; padding: 7px 13px; cursor: pointer;
    transition: color .25s, border-color .25s;
  }
  #notif-btn.active { color: #00ff7f; border-color: #00ff7f; }
  #notif-btn:hover  { color: #00ff7f; border-color: #00ff7f; }

  #screen-btn {
    position: fixed; top: 22px; right: 22px;
    background: none; border: 1px solid #1a3a1a; border-radius: 999px;
    color: #1a3a1a; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: .15em; padding: 7px 13px; cursor: pointer;
    transition: color .25s, border-color .25s, box-shadow .25s;
  }
  #screen-btn:hover  { color: #00ff7f; border-color: #00ff7f; }
  #screen-btn.active { color: #00ff7f; border-color: #00ff7f; box-shadow: 0 0 18px rgba(0,255,127,.4); }

  /* ── Screen preview overlay ── */
  #screen-preview {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    z-index: 500; opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  #screen-preview.show { opacity: 1; pointer-events: all; }
  #screen-preview img { max-width: 72vw; max-height: 52vh; border-radius: 10px; border: 1px solid #00ff7f44; }
  #screen-preview-label { color: #00ff7f; font-size: 10px; letter-spacing: .3em; font-family: 'Courier New', monospace; }

  @media (max-width: 500px) {
    #screen-btn { font-size: 9px; padding: 6px 10px; top: 14px; right: 12px; }
  }

  /* ── Mic / setup screens ── */
  #allow-screen {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; z-index: 999;
  }
  #allow-screen.hidden { display: none; }
  #allow-btn {
    background: #00ff7f; color: #000; border: none;
    border-radius: 999px; padding: 16px 44px;
    font-family: 'Courier New', monospace; font-size: 14px;
    letter-spacing: .22em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 0 32px #00ff7f; transition: transform .15s, box-shadow .15s;
  }
  #allow-btn:hover  { transform: scale(1.05); box-shadow: 0 0 54px #00ff7f; }
  #allow-btn:active { transform: scale(.97); }
  #allow-label {
    color: #1a3a1a; font-size: 11px; letter-spacing: .2em;
    text-align: center; max-width: 58vw;
  }
  #allow-skip {
    color: #0d200d; font-size: 10px; letter-spacing: .15em;
    background: none; border: none; cursor: pointer;
    font-family: 'Courier New', monospace; transition: color .2s;
  }
  #allow-skip:hover { color: #00ff7f; }

  /* ── Server setup (remote access) ── */
  #setup-screen {
    position: fixed; inset: 0; background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    z-index: 9999; font-family: 'Courier New', monospace;
  }
  #setup-screen.hidden { display: none; }
  #setup-title { color: #00ff7f; font-size: 11px; letter-spacing: .35em; }
  #setup-label { color: #1a3a1a; font-size: 10px; letter-spacing: .2em; text-align: center; max-width: 280px; line-height: 1.7; }
  #setup-input {
    background: #030c03; border: 1px solid #004020; border-radius: 999px;
    color: #00ff7f; font-family: 'Courier New', monospace; font-size: 12px;
    letter-spacing: .07em; padding: 10px 20px; outline: none; width: 240px;
    text-align: center; transition: border-color .2s;
  }
  #setup-input:focus { border-color: #00ff7f; }
  #setup-btn {
    background: #00ff7f; border: none; border-radius: 999px;
    color: #000; font-family: 'Courier New', monospace; font-size: 11px;
    letter-spacing: .2em; padding: 10px 28px; cursor: pointer;
  }
  #setup-hint { color: #0d200d; font-size: 9px; letter-spacing: .1em; text-align: center; max-width: 280px; line-height: 1.8; }

  /* ── Calendar overlay ── */
  #cal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 800; opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  #cal-overlay.show { opacity: 1; pointer-events: all; }

  #cal-card {
    width: min(520px, 96vw);
    background: rgba(0,10,3,.92);
    border: 1px solid #00ff7f33;
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    padding: 28px 28px 48px;
    transform: translateY(100%);
    transition: transform .42s cubic-bezier(.22,.68,0,1.2);
    max-height: 82vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #cal-card::-webkit-scrollbar { display: none; }
  #cal-overlay.show #cal-card { transform: translateY(0); }

  #cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  #cal-title {
    font-size: 10px; letter-spacing: .5em; color: #00ff7f;
    text-transform: uppercase;
  }
  #cal-date-label {
    font-size: 9px; letter-spacing: .25em; color: #1a3a1a;
    text-transform: uppercase; margin-top: 4px;
  }
  #cal-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: none; border: 1px solid #1a3a1a;
    color: #1a3a1a; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, border-color .2s, box-shadow .2s;
    flex-shrink: 0;
  }
  #cal-close:hover { color: #00ff7f; border-color: #00ff7f; box-shadow: 0 0 14px rgba(0,255,127,.35); }

  .cal-group { margin-bottom: 24px; }
  .cal-group-label {
    font-size: 8px; letter-spacing: .45em; color: #004422;
    text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .cal-group-label::after {
    content: ''; flex: 1; height: 1px; background: #001a0d;
  }

  .cal-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 14px;
    border: 1px solid transparent;
    cursor: pointer; margin-bottom: 8px;
    transition: background .2s, border-color .2s, transform .15s;
    position: relative; overflow: hidden;
  }
  .cal-item::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,255,127,.05), transparent);
    opacity: 0; transition: opacity .2s;
  }
  .cal-item:hover { background: rgba(0,255,127,.04); border-color: #00ff7f22; transform: translateX(3px); }
  .cal-item:hover::before { opacity: 1; }
  .cal-item.done { opacity: .38; }
  .cal-item.done .cal-item-dot { background: #004422; box-shadow: none; }

  .cal-item-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: #00ff7f;
    box-shadow: 0 0 8px #00ff7f, 0 0 16px rgba(0,255,127,.4);
    transition: box-shadow .2s;
  }
  .cal-item:hover .cal-item-dot { box-shadow: 0 0 12px #00ff7f, 0 0 24px rgba(0,255,127,.6); }

  .cal-item-time {
    font-size: 10px; letter-spacing: .12em; color: #00ff7f;
    min-width: 52px; flex-shrink: 0;
  }
  .cal-item-title {
    font-size: 12px; letter-spacing: .06em; color: #88ccaa;
    flex: 1; line-height: 1.4;
  }
  .cal-item.done .cal-item-title { text-decoration: line-through; color: #1a3a1a; }

  .cal-item-check {
    font-size: 14px; color: #004422; flex-shrink: 0;
    transition: color .15s, transform .15s;
  }
  .cal-item:hover .cal-item-check { color: #00ff7f; transform: scale(1.2); }

  .cal-empty {
    text-align: center; padding: 32px 0;
    font-size: 10px; letter-spacing: .3em; color: #0d200d;
    text-transform: uppercase;
  }

  #cal-add-bar {
    display: flex; gap: 8px; margin-top: 24px;
    border-top: 1px solid #001a0d; padding-top: 20px;
  }
  #cal-add-input {
    flex: 1; background: #030c03; border: 1px solid #004020;
    border-radius: 999px; color: #00ff7f;
    font-family: 'Courier New', monospace; font-size: 11px;
    letter-spacing: .06em; padding: 9px 16px; outline: none;
    transition: border-color .2s;
  }
  #cal-add-input:focus { border-color: #00ff7f44; }
  #cal-add-input::placeholder { color: #0d200d; }
  #cal-add-btn {
    background: #00ff7f22; border: 1px solid #00ff7f44; border-radius: 999px;
    color: #00ff7f; font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: .18em; padding: 9px 16px; cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  #cal-add-btn:hover { background: #00ff7f33; box-shadow: 0 0 16px rgba(0,255,127,.25); }

  @media (max-width: 500px) {
    #cal-card { padding: 20px 16px 40px; border-radius: 18px 18px 0 0; }
    .cal-item { padding: 10px 12px; }
    .cal-item-title { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- Server setup (shown when accessing from phone/remote) -->
<div id="setup-screen" class="hidden">
  <div id="setup-title">DOT</div>
  <div id="setup-label">enter your mac's ip to connect<br>to your dot server</div>
  <input id="setup-input" type="text" placeholder="192.168.1.x:8090" autocomplete="off" spellcheck="false" />
  <button id="setup-btn">CONNECT</button>
  <div id="setup-hint">run <span style="color:#1a3a1a">python3 ~/assistant/server.py</span> on your mac<br>it will print the ip address</div>
</div>

<!-- Mic permission -->
<div id="allow-screen">
  <button id="allow-btn">ALLOW MICROPHONE</button>
  <div id="allow-label">dot needs mic access to hear you</div>
  <button id="allow-skip">skip — use text instead</button>
</div>

<div class="eye" id="eL"><div class="pupil" id="pL"></div></div>
<div class="eye" id="eR"><div class="pupil" id="pR"></div></div>

<div id="name">DOT</div>
<div id="hint">tap to talk</div>
<div id="popup"></div>
<div id="reminder"></div>

<div id="text-bar">
  <input id="text-input" type="text" placeholder="type to dot…" autocomplete="off" spellcheck="false" />
  <button id="text-send">SEND</button>
</div>
<button id="toggle-text">TYPE</button>
<button id="notif-btn">NOTIFY</button>
<button id="screen-btn">👁 SCREEN</button>

<div id="screen-preview">
  <div id="screen-preview-label">ANALYZING…</div>
  <img id="screen-thumb" src="" alt="" />
</div>

<!-- Calendar overlay -->
<div id="cal-overlay">
  <div id="cal-card">
    <div id="cal-header">
      <div>
        <div id="cal-title">SCHEDULE</div>
        <div id="cal-date-label"></div>
      </div>
      <button id="cal-close">✕</button>
    </div>
    <div id="cal-body"></div>
    <div id="cal-add-bar">
      <input id="cal-add-input" type="text" placeholder="add task… (e.g. call mom tomorrow 3pm)" autocomplete="off" spellcheck="false" />
      <button id="cal-add-btn">+ ADD</button>
    </div>
  </div>
</div>

<script>
// ── Service worker ─────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ── Server URL ─────────────────────────────────────────────────────────────
const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
let SERVER    = isLocal ? '' : (localStorage.getItem('dot_server') || '');

function api(path) { return SERVER + path; }

// ── DOM refs ───────────────────────────────────────────────────────────────
const eL          = document.getElementById('eL');
const eR          = document.getElementById('eR');
const pL          = document.getElementById('pL');
const pR          = document.getElementById('pR');
const hint        = document.getElementById('hint');
const popupEl     = document.getElementById('popup');
const reminderEl  = document.getElementById('reminder');
const allowScreen = document.getElementById('allow-screen');
const allowBtn    = document.getElementById('allow-btn');
const allowSkip   = document.getElementById('allow-skip');
const setupScreen = document.getElementById('setup-screen');
const setupInput  = document.getElementById('setup-input');
const setupBtn    = document.getElementById('setup-btn');
const textBar     = document.getElementById('text-bar');
const textInput   = document.getElementById('text-input');
const textSend    = document.getElementById('text-send');
const toggleBtn   = document.getElementById('toggle-text');
const notifBtn    = document.getElementById('notif-btn');
const eyes        = [eL, eR];
const pupils      = [pL, pR];

// ── Server setup for remote access ────────────────────────────────────────
if (!isLocal && !SERVER) {
  allowScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
}

setupBtn.addEventListener('click', () => {
  let val = setupInput.value.trim();
  if (!val) return;
  if (!val.startsWith('http')) val = 'http://' + val;
  localStorage.setItem('dot_server', val);
  SERVER = val;
  setupScreen.classList.add('hidden');
  allowScreen.classList.remove('hidden');
});
setupInput.addEventListener('keydown', e => { if (e.key === 'Enter') setupBtn.click(); });

// ── State ──────────────────────────────────────────────────────────────────
let appState  = 'idle';
let sleeping  = false;
let textMode  = false;
let busy      = false;
let justSpoke = false;
let micStream = null;

function setState(s) {
  appState = s;
  document.body.className = sleeping ? 'sleeping' : (s === 'idle' ? '' : s);
  const labels = { idle: 'tap to talk', listening: 'listening…', thinking: 'thinking…', speaking: '' };
  hint.textContent = labels[s] ?? '';
  hint.classList.toggle('hidden', textMode && s === 'idle');
}

// ── Popup ──────────────────────────────────────────────────────────────────
let popupTimer;
function showPopup(msg) {
  popupEl.textContent = msg;
  popupEl.classList.add('show');
  clearTimeout(popupTimer);
  const ms = Math.min(Math.max(msg.trim().split(/\s+/).length * 420, 3500), 13000);
  popupTimer = setTimeout(() => popupEl.classList.remove('show'), ms);
}

let reminderTimer;
function showReminder(msg) {
  reminderEl.textContent = msg;
  reminderEl.classList.add('show');
  clearTimeout(reminderTimer);
  reminderTimer = setTimeout(() => reminderEl.classList.remove('show'), 10000);
}

// ── Pupils ─────────────────────────────────────────────────────────────────
function setPupils(x, y) {
  pupils.forEach(p => { p.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; });
}

document.addEventListener('mousemove', e => {
  if (appState === 'thinking' || sleeping) return;
  eyes.forEach((eye, i) => {
    const r  = eye.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top  + r.height / 2);
    const a  = Math.atan2(dy, dx);
    const t  = Math.min(Math.hypot(dx, dy), 180) / 180;
    pupils[i].style.transform = `translate(calc(-50% + ${Math.cos(a)*t*10}px), calc(-50% + ${Math.sin(a)*t*8}px))`;
  });
});

(function wander() {
  setTimeout(() => {
    if (appState === 'idle' && !sleeping) setPupils((Math.random()-.5)*18, (Math.random()-.5)*13);
    wander();
  }, 1800 + Math.random() * 2800);
})();

// ── Blink ──────────────────────────────────────────────────────────────────
function blink() {
  if (appState === 'thinking' || sleeping) return;
  eyes.forEach(e => e.classList.add('blink'));
  setTimeout(() => eyes.forEach(e => e.classList.remove('blink')), 120);
}
(function blinkLoop() {
  setTimeout(() => { blink(); if (Math.random() < .22) setTimeout(blink, 230); blinkLoop(); }, 2600 + Math.random() * 4200);
})();

// ── Spin (thinking) ────────────────────────────────────────────────────────
let spinId;
function startSpin() { let a=0; spinId=setInterval(()=>{ a+=.12; setPupils(Math.cos(a)*11, Math.sin(a)*8); }, 25); }
function stopSpin()  { clearInterval(spinId); }

// ── Audio ──────────────────────────────────────────────────────────────────
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

async function playWithEyeSync(arrayBuffer) {
  const ctx = getCtx();
  let audioBuffer;
  try { audioBuffer = await ctx.decodeAudioData(arrayBuffer); } catch(_) { return; }

  const source   = ctx.createBufferSource();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  source.buffer = audioBuffer;
  source.connect(analyser);
  analyser.connect(ctx.destination);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  let rafId;

  function tick() {
    analyser.getByteTimeDomainData(buf);
    let s = 0; for (let i=0; i<buf.length; i++) s += Math.abs(buf[i]-128);
    const amp = Math.min(s/buf.length/14, 1);
    setPupils(0, -amp*15);
    const g = 55+amp*100;
    eyes.forEach(e => { e.style.boxShadow=`0 0 ${g}px #00ff7f,0 0 ${g*2}px rgba(0,255,127,.4)`; });
    rafId = requestAnimationFrame(tick);
  }

  await new Promise(res => {
    source.onended = () => {
      cancelAnimationFrame(rafId);
      source.disconnect(); analyser.disconnect();
      setPupils(0,0); eyes.forEach(e => { e.style.boxShadow=''; });
      res();
    };
    source.start(); tick();
  });
}

// ── TTS: ElevenLabs → browser fallback ────────────────────────────────────
function browserSpeak(text) {
  return new Promise(res => {
    if (!window.speechSynthesis) { res(); return; }

    function doSpeak() {
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 1.05; utt.pitch = 1; utt.volume = 1;

      const voices = speechSynthesis.getVoices();
      const pref = voices.find(v => /samantha|karen|daniel|google us english|ava|zira/i.test(v.name));
      if (pref) utt.voice = pref;

      let done = false;
      let rafId;

      function finish() {
        if (done) return; done = true;
        cancelAnimationFrame(rafId);
        setPupils(0, 0); eyes.forEach(e => { e.style.boxShadow = ''; });
        res();
      }

      function tick() {
        if (!window.speechSynthesis.speaking) { finish(); return; }
        const amp = 0.3 + Math.random() * 0.7;
        setPupils(0, -amp * 14);
        const g = 55 + amp * 95;
        eyes.forEach(e => { e.style.boxShadow = `0 0 ${g}px #00ff7f,0 0 ${g*2}px rgba(0,255,127,.4)`; });
        rafId = requestAnimationFrame(tick);
      }

      utt.onstart  = () => tick();
      utt.onend    = finish;
      utt.onerror  = finish;
      // Safety timeout in case onend never fires (Chrome bug)
      setTimeout(finish, text.length * 75 + 3000);
      speechSynthesis.speak(utt);
    }

    // Voices may not be loaded yet
    const v = speechSynthesis.getVoices();
    if (v.length > 0) { doSpeak(); }
    else { speechSynthesis.addEventListener('voiceschanged', doSpeak, { once: true }); setTimeout(doSpeak, 400); }
  });
}

async function speakText(text) {
  try {
    const tr = await fetch(api('/api/speak'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (tr.ok) { await playWithEyeSync(await tr.arrayBuffer()); return; }
  } catch(_) {}
  // Fallback to browser TTS
  await browserSpeak(text);
}

// ── Notifications ──────────────────────────────────────────────────────────
let notifEnabled = localStorage.getItem('dot_notif') === '1';
if (notifEnabled) notifBtn.classList.add('active');

notifBtn.addEventListener('click', async e => {
  e.stopPropagation();
  if (Notification.permission === 'granted') {
    notifEnabled = !notifEnabled;
    localStorage.setItem('dot_notif', notifEnabled ? '1' : '0');
    notifBtn.classList.toggle('active', notifEnabled);
    if (notifEnabled) pollNotifications();
  } else {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      notifEnabled = true;
      localStorage.setItem('dot_notif', '1');
      notifBtn.classList.add('active');
      new Notification('Dot', { body: 'Notifications on. I\'ll keep you posted.', icon: '/icons/icon-192.png' });
      pollNotifications();
    }
  }
});

async function pollNotifications() {
  if (!notifEnabled || Notification.permission !== 'granted') return;
  try {
    const r = await fetch(api('/api/notifications'));
    if (!r.ok) return;
    const notes = await r.json();
    for (const n of notes) {
      // Show browser notification
      new Notification(n.title, { body: n.body, icon: '/icons/icon-192.png', badge: '/icons/icon-192.png' });
      // Also show in-app reminder
      showReminder(`${n.title}: ${n.body}`);
      // Mark delivered
      fetch(api('/api/notifications/' + n.id + '/delivered'), { method: 'POST' });
    }
  } catch(_) {}
}

// Poll every 90 seconds
setInterval(pollNotifications, 90000);
if (notifEnabled) setTimeout(pollNotifications, 3000);

// ── Silence detection ──────────────────────────────────────────────────────
let silenceCtx, silenceSrc, silenceAnalyser;
function initSilenceDetection() {
  if (silenceCtx) return;
  silenceCtx      = new (window.AudioContext || window.webkitAudioContext)();
  silenceSrc      = silenceCtx.createMediaStreamSource(micStream);
  silenceAnalyser = silenceCtx.createAnalyser();
  silenceAnalyser.fftSize = 512;
  silenceSrc.connect(silenceAnalyser);
}

// ── Recording ─────────────────────────────────────────────────────────────
let recorder, chunks = [];

async function startListening() {
  if (busy || appState !== 'idle' || !micStream) return;
  if (silenceCtx?.state === 'suspended') silenceCtx.resume();
  chunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
  recorder = new MediaRecorder(micStream, { mimeType: mime });
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => processAudio(mime);
  recorder.start(80);
  setState('listening'); blink();

  const buf     = new Uint8Array(silenceAnalyser.frequencyBinCount);
  let silenceAt = null, startedAt = Date.now(), rafId;

  function check() {
    if (appState !== 'listening') { cancelAnimationFrame(rafId); return; }
    silenceAnalyser.getByteTimeDomainData(buf);
    let s = 0; for (let i=0; i<buf.length; i++) s += Math.abs(buf[i]-128);
    if (s/buf.length < 2.5) { if (!silenceAt) silenceAt = Date.now(); } else silenceAt = null;
    const elapsed = Date.now() - startedAt;
    if (silenceAt && elapsed > 1500 && Date.now()-silenceAt > 1800) { stopListening(); return; }
    if (elapsed > 30000) { stopListening(); return; }
    rafId = requestAnimationFrame(check);
  }
  rafId = requestAnimationFrame(check);
}

function stopListening() {
  if (recorder?.state === 'recording') recorder.stop();
}

// ── Process voice → chat ───────────────────────────────────────────────────
async function processAudio(mime) {
  setState('thinking'); startSpin();
  const blob = new Blob(chunks, { type: mime });
  if (blob.size < 1000) { stopSpin(); setState('idle'); setTimeout(startListening, 300); return; }

  let transcript = '';
  try {
    const r = await fetch(api('/api/transcribe'), {
      method: 'POST',
      headers: { 'Content-Type': mime, 'X-Audio-Mime': mime },
      body: blob
    });
    if (r.ok) transcript = (await r.json()).text?.trim() || '';
  } catch(_) {}

  if (!transcript || justSpoke) { stopSpin(); setState('idle'); setTimeout(startListening, 400); return; }
  if (/\b(go to sleep|sleep now|goodnight|good night|shut down)\b/i.test(transcript)) { stopSpin(); goSleep(); return; }
  if (/\b(wake up|good morning|hey dot)\b/i.test(transcript)) { stopSpin(); wakeUp(); return; }
  if (SCREEN_RE.test(transcript)) { stopSpin(); await captureScreen(transcript); return; }
  if (CAL_RE.test(transcript)) { stopSpin(); await showCalendar(true); return; }
  await handleInput(transcript);
}

// ── Handle input ───────────────────────────────────────────────────────────
async function handleInput(text) {
  busy = true;
  setState('thinking');

  let reply = '';
  try {
    const r = await fetch(api('/api/chat'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const d = await r.json();
    reply = d.reply || (d.error ? 'Something went wrong — try again.' : '');
  } catch(_) {
    reply = 'Lost connection — try again.';
  }

  stopSpin();
  setState('speaking');
  showPopup(reply);

  await speakText(reply);

  setState('idle');
  busy = false;
  justSpoke = true;
  setTimeout(() => { justSpoke = false; }, 1800);
  if (!textMode) setTimeout(startListening, 1200);
}

// ── Calendar reminders (local polling) ────────────────────────────────────
const firedReminders = new Set();
async function checkReminders() {
  try {
    const r = await fetch(api('/api/tasks'));
    if (!r.ok) return;
    const tasks = await r.json();
    const now = Date.now();
    for (const t of tasks) {
      if (t.done || firedReminders.has(t.id)) continue;
      const diff = new Date(t.datetime).getTime() - now;
      if (diff <= 120000 && diff >= -120000) {
        firedReminders.add(t.id);
        const label = diff <= 0 ? 'now' : `in ${Math.ceil(diff/60000)} min`;
        showReminder(`${t.title} — ${label}`);
        if (appState === 'idle' && !busy) {
          setState('speaking');
          await speakText(`Reminder: ${t.title}`);
          setState('idle');
        }
      }
    }
  } catch(_) {}
}
setInterval(checkReminders, 30000);

// ── Daily briefing ─────────────────────────────────────────────────────────
async function triggerBriefing() {
  try {
    const r = await fetch(api('/api/briefing'));
    if (!r.ok) return;
    const { text } = await r.json();
    if (!text) return;
    setState('speaking');
    showPopup(text);
    await speakText(text);
    setState('idle');
  } catch(_) {}
}
function checkDailyBriefing() {
  const key = 'dot_briefing_' + new Date().toDateString();
  if (!localStorage.getItem(key)) {
    localStorage.setItem(key, '1');
    setTimeout(triggerBriefing, 1500);
  }
}

// ── Mic setup ──────────────────────────────────────────────────────────────
async function setupMic() {
  allowBtn.textContent = 'CONNECTING…';
  allowBtn.disabled = true;
  try {
    getCtx();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    allowScreen.classList.add('hidden');
    initSilenceDetection();
    checkReminders();
    checkDailyBriefing();
    setTimeout(startListening, 500);
  } catch(err) {
    allowBtn.textContent = 'TRY AGAIN';
    allowBtn.disabled = false;
    document.getElementById('allow-label').textContent =
      err.name === 'NotFoundError' ? 'no microphone found' : 'mic blocked — check browser site settings';
  }
}

const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
const isHttps  = location.protocol === 'https:';

// On mobile over HTTP, mic won't work — skip to text automatically
if (isMobile && !isHttps) {
  allowScreen.classList.add('hidden');
  enableTextMode();
  showReminder('voice needs https — use text or visit https://' + (SERVER.replace('http://','').replace(':8090',':8443') || '192.168.1.188:8443'));
}

allowBtn.addEventListener('click',  e => { e.stopPropagation(); setupMic(); });
allowSkip.addEventListener('click', e => { e.stopPropagation(); allowScreen.classList.add('hidden'); enableTextMode(); });

// ── Interrupt ─────────────────────────────────────────────────────────────
function interruptAndListen() {
  // Stop audio
  if (audioCtx) audioCtx.suspend();
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  clearTimeout(popupTimer);
  popupEl.classList.remove('show');
  eyes.forEach(e => { e.style.boxShadow = ''; });
  setPupils(0, 0);
  busy = false;
  setTimeout(() => { if (audioCtx) audioCtx.resume(); }, 100);
  setState('idle');
  setTimeout(startListening, 150);
}

// ── Sleep / wake ───────────────────────────────────────────────────────────
function goSleep() {
  sleeping = true;
  document.body.className = 'sleeping';
  hint.textContent = 'zzz…';
  hint.classList.remove('hidden');
  showPopup('goodnight');
}
function wakeUp() {
  sleeping = false;
  setState('idle');
  blink();
  showPopup('hey');
  setTimeout(() => { if (!textMode) startListening(); }, 600);
}

// ── Text mode ──────────────────────────────────────────────────────────────
function enableTextMode() {
  textMode = true;
  textBar.classList.add('show');
  hint.classList.add('hidden');
  toggleBtn.textContent = 'VOICE';
  textInput.focus();
}
function disableTextMode() {
  textMode = false;
  textBar.classList.remove('show');
  hint.classList.remove('hidden');
  toggleBtn.textContent = 'TYPE';
  if (micStream) setTimeout(startListening, 300);
}
toggleBtn.addEventListener('click', e => { e.stopPropagation(); textMode ? disableTextMode() : enableTextMode(); });

async function sendText() {
  const msg = textInput.value.trim();
  if (!msg || busy) return;
  textInput.value = '';
  if (SCREEN_RE.test(msg)) { await captureScreen(msg); return; }
  if (CAL_RE.test(msg)) { await showCalendar(true); return; }
  startSpin();
  await handleInput(msg);
}
textSend.addEventListener('click',  e => { e.stopPropagation(); sendText(); });
textInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') sendText(); });

// ── Calendar UI ───────────────────────────────────────────────────────────
const calOverlay = document.getElementById('cal-overlay');
const calBody    = document.getElementById('cal-body');
const calClose   = document.getElementById('cal-close');
const calAddInput = document.getElementById('cal-add-input');
const calAddBtn   = document.getElementById('cal-add-btn');
document.getElementById('cal-date-label').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

const CAL_RE = /\b(show (me )?(my )?(calendar|tasks?|schedule|todo|reminders?|agenda)|what'?s? (on )?(my )?(calendar|schedule|agenda)|list (my )?(tasks?|calendar|reminders?)|my (tasks?|calendar|schedule|todo|agenda)|what do i have|upcoming (tasks?|events?|reminders?))\b/i;

function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
}
function fmtDay(iso) {
  const d = new Date(iso); const n = new Date();
  const ds = d.toDateString(); const ns = n.toDateString();
  const tom = new Date(n); tom.setDate(n.getDate()+1);
  if (ds === ns) return 'TODAY';
  if (ds === tom.toDateString()) return 'TOMORROW';
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
}

async function showCalendar(speak = true) {
  let tasks = [];
  try {
    const r = await fetch(api('/api/tasks'));
    if (r.ok) tasks = await r.json();
  } catch(_) {}

  // Group by day label
  const groups = {};
  const order  = [];
  for (const t of tasks.filter(t => !t.done)) {
    const label = fmtDay(t.datetime);
    if (!groups[label]) { groups[label] = []; order.push(label); }
    groups[label].push(t);
  }

  if (order.length === 0) {
    calBody.innerHTML = '<div class="cal-empty">nothing scheduled</div>';
  } else {
    calBody.innerHTML = order.map(label => `
      <div class="cal-group">
        <div class="cal-group-label">${label}</div>
        ${groups[label].map(t => `
          <div class="cal-item" data-id="${t.id}">
            <div class="cal-item-dot"></div>
            <div class="cal-item-time">${fmtTime(t.datetime)}</div>
            <div class="cal-item-title">${t.title}</div>
            <div class="cal-item-check">✓</div>
          </div>
        `).join('')}
      </div>
    `).join('');

    // Tap to complete
    calBody.querySelectorAll('.cal-item').forEach(el => {
      el.addEventListener('click', async e => {
        e.stopPropagation();
        const id = el.dataset.id;
        el.classList.add('done');
        try {
          await fetch(api('/api/chat'), {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({message: `complete task id ${id}`})
          });
        } catch(_) {}
        setTimeout(() => el.remove(), 600);
      });
    });
  }

  calOverlay.classList.add('show');

  if (speak) {
    const total = tasks.filter(t => !t.done).length;
    const todayCount = (groups['TODAY'] || []).length;
    let summary = total === 0
      ? "You're all clear — nothing on your schedule."
      : todayCount > 0
        ? `You've got ${total} thing${total>1?'s':''} coming up, ${todayCount} today.`
        : `You've got ${total} upcoming thing${total>1?'s':''}.`;
    setState('speaking');
    showPopup(summary);
    await speakText(summary);
    setState('idle');
    if (!textMode) setTimeout(startListening, 1200);
  }
}

function hideCalendar() {
  calOverlay.classList.remove('show');
}

calClose.addEventListener('click', e => { e.stopPropagation(); hideCalendar(); });
calOverlay.addEventListener('click', e => { if (e.target === calOverlay) hideCalendar(); });

// Add task from calendar UI
async function calAddTask() {
  const raw = calAddInput.value.trim();
  if (!raw) return;
  calAddInput.value = '';
  calAddBtn.textContent = '…';
  try {
    const r = await fetch(api('/api/chat'), {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: `add task: ${raw}`})
    });
    const d = await r.json();
    if (d.reply) showPopup(d.reply);
  } catch(_) {}
  calAddBtn.textContent = '+ ADD';
  // Refresh calendar view
  setTimeout(() => showCalendar(false), 400);
}
calAddBtn.addEventListener('click', e => { e.stopPropagation(); calAddTask(); });
calAddInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') calAddTask(); });

// ── Screen capture ────────────────────────────────────────────────────────
const screenBtn     = document.getElementById('screen-btn');
const screenPreview = document.getElementById('screen-preview');
const screenThumb   = document.getElementById('screen-thumb');
const screenLabel   = document.getElementById('screen-preview-label');

const SCREEN_RE = /\b(what (do you|can you) see|look at (my |the )?screen|what'?s on (my |the )?screen|check (my |the )?screen|help me with this|look at this|what('?s| is) (this|that)|describe (my |the )?screen|see (my |the )?screen)\b/i;

async function captureScreen(question) {
  if (busy) return;
  question = question || 'What do you see on this screen? Describe it clearly — what app is open, what content is visible, and how can you help.';

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { max: 1280 }, height: { max: 720 }, frameRate: 1 }
    });
  } catch(err) {
    if (err.name !== 'NotAllowedError' && err.name !== 'AbortError') {
      showPopup('Could not access screen — try saying "what do you see" instead.');
    }
    return;
  }

  screenBtn.classList.add('active');
  busy = true;
  setState('thinking');
  screenLabel.textContent = 'CAPTURING…';
  screenPreview.classList.add('show');

  // Draw to canvas
  const video = document.createElement('video');
  video.srcObject = stream;
  video.muted = true;
  video.style.display = 'none';
  document.body.appendChild(video);
  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();
  await new Promise(res => setTimeout(res, 150));

  const canvas = document.createElement('canvas');
  const maxW = 1280;
  const scale = Math.min(1, maxW / video.videoWidth);
  canvas.width  = Math.round(video.videoWidth  * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

  stream.getTracks().forEach(t => t.stop());
  document.body.removeChild(video);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  screenThumb.src = dataUrl;
  screenLabel.textContent = 'ANALYZING…';
  startSpin();

  const b64 = dataUrl.split(',')[1];

  let reply = '';
  try {
    const r = await fetch(api('/api/vision'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64, question, mime: 'image/jpeg' })
    });
    const d = await r.json();
    reply = d.reply || 'I could not analyze the screen.';
  } catch(_) {
    reply = 'Lost connection while analyzing the screen.';
  }

  screenPreview.classList.remove('show');
  stopSpin();
  setState('speaking');
  showPopup(reply);
  await speakText(reply);
  setState('idle');
  busy = false;
  screenBtn.classList.remove('active');
  justSpoke = true;
  setTimeout(() => { justSpoke = false; }, 1800);
  if (!textMode) setTimeout(startListening, 1200);
}

screenBtn.addEventListener('click', e => { e.stopPropagation(); captureScreen(); });

// ── Click / Space ──────────────────────────────────────────────────────────
document.addEventListener('click', () => {
  if (!allowScreen.classList.contains('hidden')) return;
  if (!setupScreen.classList.contains('hidden')) return;
  if (sleeping) { wakeUp(); return; }
  if (!textMode) startListening();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { hideCalendar(); return; }
  if (document.activeElement === textInput || document.activeElement === setupInput || document.activeElement === calAddInput) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (sleeping) { wakeUp(); return; }
    if (textMode) return;
    if (appState === 'speaking') { interruptAndListen(); return; }
    startListening();
  }
});
