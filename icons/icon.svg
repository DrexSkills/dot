    <radialGradient id="jCore" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#9BE6FF"/><stop offset=".6" stop-color="#2EB4FF" stop-opacity=".9"/><stop offset="1" stop-color="#0A6CFF" stop-opacity="0"/></radialGradient>
